name: Send Daily Study Notification

on:
  schedule:
    # GitHub applies this schedule in Central time, including daylight saving.
    # Minute 53 avoids the heavier start-of-hour scheduling window.
    - cron: '53 7 * * *'
      timezone: 'America/Chicago'
  workflow_dispatch: # Allow manual trigger for testing

permissions:
  contents: read

jobs:
  send-notification:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Test notification title decoding
        run: node --test scripts/decode-html-entities.test.js

      - name: Install dependencies
        run: npm install firebase-admin@12 google-auth-library@9

      - name: Send push notification
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: node scripts/send-notification.js
