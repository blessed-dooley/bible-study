name: Publish Daily Bible Study

on:
  push:
    branches: [main]
  schedule:
    # 8 PM UTC = 3 PM CDT (Central Daylight) / In Nov bump to '0 21' for 3 PM CST year-round
    - cron: '0 20 * * *'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Validate reader JavaScript
        run: |
          node --check assets/notifications.js
          node --check assets/reader-controls.js
          node --check assets/verse-popover.js
          node --check assets/archive-search.js
          node --check assets/full-text-search.js

      - name: Publish tomorrow's study from staging
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        run: |
          # Compute tomorrow in Central Time. GitHub-hosted runners can start hours late and cross UTC midnight.
          TOMORROW=$(TZ=America/Chicago date -d "+1 day" +%Y-%m-%d)
          FILE="staging/${TOMORROW}.html"

          if [ -f "$FILE" ]; then
            echo "Publishing ${TOMORROW}.html"
            cp "$FILE" "${TOMORROW}.html"
            rm "$FILE"
          else
            echo "No file found for ${TOMORROW} in staging/"
            exit 0
          fi

      - name: Refresh navigation and search data
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        run: |
          python3 tools/refresh-site-data.py --root .
          python3 tools/generate_studies_json.py --root . --out studies.json
          python3 tools/generate_search_index.py --root . --out search-index.json
          python3 tools/generate_studies_json.py --root . --out studies.json --check
          python3 tools/generate_search_index.py --root . --out search-index.json --check

      - name: Regenerate sitemap.xml
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        run: |
          python3 tools/generate_sitemap.py --root . --out sitemap.xml
          python3 tools/generate_sitemap.py --root . --out sitemap.xml --check

      - name: Commit and push
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && echo "Nothing to commit" && exit 0
          TOMORROW=$(TZ=America/Chicago date -d "+1 day" +%Y-%m-%d)
          git commit -m "Publish ${TOMORROW} daily study"
          git push

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
          name: github-pages-${{ github.run_attempt }}

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          artifact_name: github-pages-${{ github.run_attempt }}
